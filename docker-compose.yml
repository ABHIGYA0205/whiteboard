services:
  mongo:
    image: mongo:7-jammy
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: production
      PORT: 4001
      MONGO_URI: mongodb://mongo:27017/whiteboard
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000,http://localhost:3001}
      BOARD_SECRET: ${BOARD_SECRET:?Set BOARD_SECRET in the Compose .env file}
      POLLINATIONS_API_KEY: ${POLLINATIONS_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - uploads_data:/app/server/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/health/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      mongo:
        condition: service_healthy
    restart: always

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        INTERNAL_API_URL: http://server:4001
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: always

volumes:
  mongo_data:
  uploads_data:
