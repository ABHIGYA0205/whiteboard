version: '3.8'

services:
  mongo:
    image: mongo:7-jammy
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - MONGO_URI=mongodb://mongo:27017/whiteboard
      - CLIENT_ORIGIN=http://localhost:3000,http://localhost:3001
    depends_on:
      mongo:
        condition: service_healthy
    restart: always

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4001
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:4001
    depends_on:
      - server
    restart: always

volumes:
  mongo_data:
