<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cf-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="cf-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Squircle Base with subtle inner glow -->
  <rect width="64" height="64" rx="16" fill="url(#cf-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2" />
  
  <!-- Canvas Layer: Rotated rounded card representing the infinite board -->
  <g filter="url(#cf-shadow)">
    <!-- Canvas frame -->
    <rect x="13" y="13" width="38" height="38" rx="9" fill="#0b0f19" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" />
    
    <!-- Flow Stroke / Dynamic Brush wave loop -->
    <path
      d="M38 18 C46 18, 48 25, 43 30 C37 36, 20 32, 20 41 C20 46, 26 48, 33 46 C39 44, 43 40, 46 35"
      fill="none"
      stroke="#ffffff"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M38 18 C46 18, 48 25, 43 30 C37 36, 20 32, 20 41 C20 46, 26 48, 33 46 C39 44, 43 40, 46 35"
      fill="none"
      stroke="url(#cf-stroke)"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    
    <!-- Glowing stylus / spark head -->
    <circle cx="46" cy="35" r="3.2" fill="#ffffff" />
    <circle cx="46" cy="35" r="1.6" fill="#38bdf8" />
  </g>
</svg>
